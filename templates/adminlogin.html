<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preload" href="/static/admin.css" as="style">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin.css">
</head>

<body class="bg-light">
<div class="container">
  <div class="row justify-content-center align-items-center vh-100">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">Admin Login</h3>

          <form id="loginForm">
            <input type="email" id="email" class="form-control mb-3" placeholder="Email" required>
            <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>
            <button class="btn btn-primary w-100">Login</button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
const BASE_URL = "https://leads-backend-2piw.onrender.com/api";

// timeout helper (agar server slow ho)
function timeoutFetch(url, options = {}, ms = 15000) {
  return Promise.race([
    fetch(url, options),
    new Promise((_, reject) => setTimeout(() => reject(new Error("Request timed out")), ms)),
  ]);
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = e.target.querySelector("button");
  btn.disabled = true;
  btn.innerText = "Logging in...";

  const emailVal = document.getElementById("email").value.trim();
  const passwordVal = document.getElementById("password").value.trim();

  try {
    const res = await timeoutFetch(`${BASE_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: emailVal, password: passwordVal }),
    });

    const data = await res.json();
    console.log("LOGIN RESPONSE:", data);

    const token = data.token || data.data?.token || data.accessToken;

    if (!res.ok || !token) throw new Error(data.message || "Login failed");

    localStorage.setItem("token", token);

    // 👇 Welcome popup
    alert("Welcome to Wholeleads Admin 👋");

    // 👇 slight delay then redirect
    setTimeout(() => {
      window.location.href = "admin.html";
    }, 1200);

  } catch (err) {
    alert(err.message || "Server slow hai. Please try again.");
  } finally {
    btn.disabled = false;
    btn.innerText = "Login";
  }
});
</script>

</body>
</html>
