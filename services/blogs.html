<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blogs | WholeLeads</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="blogs.css">
</head>

<body>

<div class="container py-5">
  <h1 class="text-center mb-5">Latest Blogs</h1>
  <div class="row" id="blogsContainer"></div>
</div>

<script>
const BASE_URL = "https://leads-backend-2piw.onrender.com/api";

async function loadPublicBlogs() {
  const res = await fetch(`${BASE_URL}/blogs`);
  const data = await res.json();
  const blogs = data.blogs || [];

  const container = document.getElementById("blogsContainer");
  container.innerHTML = "";

  blogs.forEach(blog => {
    container.innerHTML += `
      <div class="col-md-4 mb-4">
        <div class="blog-card">
          <h4>${blog.title}</h4>
          <p>${blog.content.substring(0,120)}...</p>
          <a href="single-blog.html?id=${blog._id}">Read More →</a>
        </div>
      </div>
    `;
  });
}

loadPublicBlogs();
</script>

</body>
</html>
