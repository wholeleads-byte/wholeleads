<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WholeLeads Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../static/wholeadmin.css">

<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<!-- FREE TINYMCE -->
<script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>
</head>
<body>

<div class="sidebar">
  <h2>WholeLeads</h2>
  <a href="#" onclick="showDashboard()">Dashboard</a>
  <a href="#" onclick="showBlogs()">Blogs</a>
  <a href="#" onclick="showLeads()">Leads</a>
  <a href="#" onclick="showSettings()">Settings</a>
  <a href="#" onclick="logout()">Logout</a>
</div>

<div class="main-content">

<!-- DASHBOARD -->
<div id="dashboardSection">
  <h2>Welcome Admin 👋</h2>
  <div class="row mt-3">
    <div class="col-md-4">
      <div class="card-box">
        <h5>Total Blogs</h5>
        <h2 id="blogCount">0</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-box">
        <h5>Total Leads</h5>
        <h2 id="leadCount">0</h2>
      </div>
    </div>
  </div>
</div>

<!-- BLOGS -->
<div id="blogsSection" style="display:none;">
  <h2>Blogs</h2>

  <form id="blogForm" class="mb-3">
    <input type="hidden" id="blogId">

    <input id="title" class="form-control mb-2" placeholder="Blog Title" required>

    <textarea id="content"></textarea>

    <input id="tags" class="form-control mt-2" placeholder="Tags (comma separated)">

    <button class="btn btn-primary mt-2">Save Blog</button>
    <button type="button" class="btn btn-secondary mt-2" onclick="resetBlog()">Cancel</button>
  </form>

  <div id="blogList"></div>
</div>

<!-- LEADS -->
<div id="leadsSection" style="display:none;">
  <h2>Leads</h2>
  <div id="leadList"></div>
</div>

<!-- SETTINGS -->
<div id="settingsSection" style="display:none;">
  <h2>Site Settings</h2>

  <div class="card p-3 mb-3">
    <label>Logo URL</label>
    <input id="siteLogo" class="form-control mb-2"
           placeholder="Enter logo image URL">
  </div>

  <div class="card p-3 mb-3">

    <label>Email</label>
    <input id="siteEmail" class="form-control mb-2"
           placeholder="Enter email">

    <label>Phone</label>
    <input id="sitePhone" class="form-control mb-2"
           placeholder="Enter phone number">

    <label>Address</label>
    <input id="siteAddress" class="form-control mb-2"
           placeholder="Enter address">

    <button class="btn btn-success w-100"
            onclick="saveSettings()">
      Save Settings
    </button>
  </div>
</div>

</div>

<script src="../static/admin.js"></script>
</body>
</html>
