<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blogs | WholeLeads</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="blogs.css">
</head>

<body>

<div class="container py-5">
  <h1 class="text-center mb-5">Latest Blogs</h1>
  <div class="row" id="blogsContainer"></div>
</div>

<script>
const BASE_URL = "https://leads-backend-2piw.onrender.com/api";

async function loadBlogs() {
  const container = document.getElementById("blogsContainer");
  container.innerHTML = "<p class='text-center'>Loading...</p>";

  try {
    const res = await fetch(`${BASE_URL}/blogs`);
    const data = await res.json();

    console.log("API RESPONSE ===>", data);

    // ✔ blogs actually data.data me aa rahe hain
    const blogs = (data.data || []).filter(b => b.isPublished === true);

    if (!blogs.length) {
      container.innerHTML = "<p class='text-center'>No blogs found</p>";
      return;
    }

    container.innerHTML = blogs
      .map(
        (b) => `
        <div class="col-md-4 mb-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">${b.title}</h5>
              <p class="card-text">
                ${(b.content || "").substring(0,150)}...
              </p>

              <a href="blog-detail.html?id=${b._id}" class="btn btn-primary btn-sm">
                Read More
              </a>
            </div>
          </div>
        </div>
      `
      )
      .join("");
  } catch (err) {
    console.error("Error loading blogs:", err);
    container.innerHTML =
      "<p class='text-danger text-center'>Failed to load blogs</p>";
  }
}

loadBlogs();
</script>

</body>
</html>
