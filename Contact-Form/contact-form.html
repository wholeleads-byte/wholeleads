<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whole Leads Contact Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="contact.css">
</head>

<body>

  <div class="container my-5">
    <div class="row align-items-center contact-section shadow-lg rounded-4 overflow-hidden">

      <!-- Left Side: Text -->
      <div class="col-lg-6 left-side p-5 text-white text-center text-lg-start">
        <h1 class="mb-3">Whole Leads</h1>
        <h3 class="mb-3">Get in touch with us</h3>
        <p>Fill the contact form and our team will reach out to you shortly. We help businesses grow through targeted
          leads and efficient marketing strategies.</p>
      </div>

      <!-- Right Side: Form -->
      <div class="col-lg-6 right-side p-5 bg-white">
        <h2 class="mb-4 text-center">Contact Us</h2>
        <form id="contactForm">
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Contact Number</label>
            <input type="number" class="form-control" id="contactNumber" name="contactNumber">
          </div>

          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" class="form-control" id="subject" name="subject" placeholder="Subject">
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message..."
              required></textarea>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
          </div>

          <div id="response" class="mt-3 text-center"></div>
        </form>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="contact-form.js"></script>

</body>

</html>
