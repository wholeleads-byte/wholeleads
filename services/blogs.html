<div class="container py-5">
  <h1 class="text-center mb-5">Latest Blogs</h1>

  <div class="row" id="blogsContainer"></div>
</div>

<script>
const BASE_URL = "https://leads-backend-2piw.onrender.com/api";

async function loadBlogs() {
  const container = document.getElementById("blogsContainer");
  container.innerHTML = "<p class='text-center'>Loading...</p>";

  try {
    const res = await fetch(`${BASE_URL}/blogs`);
    const data = await res.json();

    const blogs = (data.data || []).filter(b => b.isPublished);

    if (!blogs.length) {
      container.innerHTML = "<p class='text-center'>No blogs found</p>";
      return;
    }

    container.innerHTML = blogs.map(b => `
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm p-3">

          <h5>${b.title}</h5>

          <div class="blog-content mt-2">
            ${b.content}
          </div>

          <a href="blog-detail.html?id=${b._id}" class="btn btn-primary btn-sm mt-3">
            Read More
          </a>

        </div>
      </div>
    `).join("");

  } catch (err) {
    console.error(err);
    container.innerHTML =
      "<p class='text-danger text-center'>Failed to load blogs</p>";
  }
}

loadBlogs();
</script>
